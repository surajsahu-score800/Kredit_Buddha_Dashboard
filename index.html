<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- Browser Tab Title & Logo Icon -->
  <title>Kredit buddha Dashboard</title>
  <link rel="icon" type="image/png" href="logo.png">
  
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: #f8fafc;
      color: #0f172a;
      min-height: 100vh;
      padding: 30px 16px;
    }

    .app-container {
      max-width: 900px;
      margin: 0 auto;
      background: #ffffff;
      border-radius: 20px;
      border: 1px solid #e2e8f0;
      box-shadow: 0 20px 40px -15px rgba(15, 23, 42, 0.05);
      padding: 32px;
    }

    /* Brand Header */
    .brand-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
      flex-wrap: wrap;
      gap: 16px;
      padding-bottom: 20px;
      border-bottom: 1px solid #f1f5f9;
    }
    .brand-logo-title {
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .brand-logo-title img {
      height: 42px;
      width: auto;
      object-fit: contain;
    }
    .brand-logo-title h2 {
      font-size: 22px;
      font-weight: 800;
      color: #0f172a;
      letter-spacing: -0.5px;
    }
    .status-badge {
      font-size: 13px;
      font-weight: 600;
      padding: 6px 16px;
      border-radius: 30px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .status-badge.loading { background-color: #eff6ff; color: #2563eb; }
    .status-badge.ready { background-color: #f0fdf4; color: #16a34a; }
    .status-badge.error { background-color: #fef2f2; color: #dc2626; }

    /* Search Input Wrapper */
    .search-wrapper {
      margin-bottom: 28px;
    }
    .search-input {
      width: 100%;
      padding: 18px 22px;
      font-size: 16px;
      font-weight: 600;
      color: #0f172a;
      background-color: #f8fafc;
      border: 2px solid #e2e8f0;
      border-radius: 14px;
      outline: none;
      transition: all 0.2s ease;
    }
    .search-input:focus {
      background-color: #ffffff;
      border-color: #f97316;
      box-shadow: 0 0 0 4px rgba(249, 115, 22, 0.12);
    }
    .search-input::placeholder { color: #94a3b8; font-weight: 400; }

    .details-view {
      display: none;
      animation: slideUp 0.3s ease-out;
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Customer Details Grid */
    .section-title {
      font-size: 14px;
      font-weight: 800;
      color: #475569;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .section-title::after {
      content: '';
      flex: 1;
      height: 1px;
      background: #e2e8f0;
    }

    .info-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
      margin-bottom: 32px;
    }
    @media (max-width: 640px) {
      .info-grid { grid-template-columns: 1fr; }
    }
    .info-box {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      padding: 14px 18px;
      border-radius: 12px;
    }
    .info-box.highlight {
      background: #fff5f5;
      border-color: #fecaca;
    }
    .info-box.highlight .label { color: #dc2626; }
    .info-box.highlight .value { color: #dc2626; font-size: 17px; }

    .info-box .label {
      font-size: 11px;
      font-weight: 700;
      color: #64748b;
      margin-bottom: 4px;
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }
    .info-box .value {
      font-size: 15px;
      font-weight: 700;
      color: #0f172a;
      word-break: break-word;
    }
    .dpd-badge {
      display: inline-block;
      padding: 2px 10px;
      background: #fee2e2;
      color: #dc2626;
      border-radius: 6px;
      font-weight: 800;
    }

    /* Agent Remark Form */
    .remark-card {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 16px;
      padding: 24px;
    }
    textarea {
      width: 100%;
      padding: 14px;
      border: 2px solid #cbd5e1;
      border-radius: 12px;
      font-family: inherit;
      font-size: 14px;
      font-weight: 500;
      color: #0f172a;
      outline: none;
      resize: vertical;
      background: #ffffff;
      transition: border-color 0.2s;
    }
    textarea:focus { border-color: #f97316; }
    .submit-btn {
      width: 100%;
      margin-top: 14px;
      padding: 16px;
      background-color: #f97316;
      color: #ffffff;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.1s;
    }
    .submit-btn:hover { background-color: #ea580c; }
    .submit-btn:active { transform: scale(0.99); }
  </style>
</head>
<body>

<div class="app-container">
  
  <div class="brand-header">
    <div class="brand-logo-title">
      <img src="logo.png" alt="Kredit Buddha Logo" onerror="this.style.display='none'">
      <h2>Kredit Buddha Dashboard</h2>
    </div>
    <div id="appStatus" class="status-badge loading">Loading sheet data...</div>
  </div>

  <div class="search-wrapper">
    <input type="text" id="searchInput" class="search-input" placeholder="Type Mobile Number or Loan No..." oninput="instantSearch()" disabled>
  </div>

  <div id="detailsCard" class="details-view">
    
    <div class="section-title">Customer Details</div>
    <div class="info-grid" id="customerGridContainer"></div>

    <div class="remark-card">
      <div class="section-title">Agent Remark</div>
      <textarea id="remarkInput" rows="3" placeholder="Enter collection or follow-up remark here..."></textarea>
      <button class="submit-btn" onclick="submitRemark()">Submit Remark</button>
    </div>

  </div>
</div>

<script>
  // Your deployed Google Apps Script Web App URL
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx0Bpa3zBzHvGiOAhKAjaP05SMBrlfuA4OWZnSvvRlUwiftXNyv0vA9JUyQNFW8H1LUPQ/exec"; 
  
  let allRecords = [];
  let currentRecord = null;

  // Fetch all records once when page loads
  window.addEventListener('DOMContentLoaded', async () => {
    const statusBox = document.getElementById("appStatus");
    const searchInput = document.getElementById("searchInput");

    try {
      const response = await fetch(SCRIPT_URL);
      const result = await response.json();

      if (result.status === "success") {
        allRecords = result.data;
        statusBox.className = "status-badge ready";
        statusBox.innerText = `● Ready (${allRecords.length} records loaded)`;
        searchInput.disabled = false;
        searchInput.focus();
      } else {
        throw new Error("Failed to load");
      }
    } catch (err) {
      statusBox.className = "status-badge error";
      statusBox.innerText = "● Error loading Google Sheet";
    }
  });

  // Fast search inside browser memory as user types
  function instantSearch() {
    const query = document.getElementById("searchInput").value.trim().toLowerCase();
    const detailsCard = document.getElementById("detailsCard");
    const gridContainer = document.getElementById("customerGridContainer");

    if (!query) {
      detailsCard.style.display = "none";
      currentRecord = null;
      return;
    }

    const match = allRecords.find(item => {
      const loanNo = item.loanNo ? item.loanNo.toString().toLowerCase() : "";
      const mobile = item.mobile ? item.mobile.toString().toLowerCase() : "";
      return loanNo === query || mobile === query;
    });

    if (match) {
      currentRecord = match;
      gridContainer.innerHTML = "";

      // All 14 custom headers mapped exactly
      const fields = [
        { label: "Mobile Number", val: match.mobile },
        { label: "Loan No", val: match.loanNo },
        { label: "Customer Name", val: match.customerName },
        { label: "Gender", val: match.gender },
        { label: "Loan Amount", val: match.loanAmount ? "₹" + match.loanAmount : "-" },
        { label: "Settlement Amount", val: match.settlementAmount ? "₹" + match.settlementAmount : "-" },
        { label: "Loan Repay Amount (Waiver Amount)", val: match.repayAmount ? "₹" + match.repayAmount : "-" },
        { label: "Total Collection (Already Collected)", val: match.totalCollection ? "₹" + match.totalCollection : "₹0" },
        { label: "Outstanding Amount (Pitch Amount)", val: match.outstandingAmount ? "₹" + match.outstandingAmount : "₹0", highlight: true },
        { label: "Loan Disburse Date", val: match.disburseDate },
        { label: "Current City", val: match.currentCity },
        { label: "Current State", val: match.currentState },
        { label: "DPD", val: match.dpd, isDpd: true },
        { label: "Tenure", val: match.tenure }
      ];

      fields.forEach(f => {
        const val = f.val !== undefined && f.val !== "" ? f.val : "-";

        gridContainer.innerHTML += `
          <div class="info-box ${f.highlight ? 'highlight' : ''}">
            <div class="label">${f.label}</div>
            <div class="value">${f.isDpd ? `<span class="dpd-badge">${val}</span>` : val}</div>
          </div>`;
      });

      document.getElementById("remarkInput").value = match.remark || "";
      detailsCard.style.display = "block";
    } else {
      detailsCard.style.display = "none";
      currentRecord = null;
    }
  }

  // Update Remark in Google Sheet
  async function submitRemark() {
    if (!currentRecord) return;

    const newRemark = document.getElementById("remarkInput").value.trim();
    const statusBox = document.getElementById("appStatus");

    statusBox.className = "status-badge loading";
    statusBox.innerText = "Saving remark...";

    try {
      const response = await fetch(SCRIPT_URL, {
        method: "POST",
        body: JSON.stringify({
          rowIndex: currentRecord.rowIndex,
          remark: newRemark
        })
      });
      const result = await response.json();

      if (result.status === "success") {
        currentRecord.remark = newRemark;
        statusBox.className = "status-badge ready";
        statusBox.innerText = "● Remark saved successfully!";
      } else {
        throw new Error("Save failed");
      }
    } catch (err) {
      statusBox.className = "status-badge error";
      statusBox.innerText = "● Failed to save remark";
    }
  }
</script>

</body>
</html>
